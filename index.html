
<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            padding: 30px;
            text-align: center;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            background: #eee;
            margin: 10px;
            padding: 10px;
            list-style: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Task Management App</h1>

    <input type="text" id="taskInput"
        placeholder="Enter your task">

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function displayTasks() {
        let list = document.getElementById("taskList");
        list.innerHTML = "";

        tasks.forEach((task, index) => {
            let li = document.createElement("li");

            li.innerHTML = `
                ${task}
                <button onclick="deleteTask(${index})">
                    Delete
                </button>
            `;

            list.appendChild(li);
        });
    }

    function addTask() {
        let input = document.getElementById("taskInput");
        let task = input.value.trim();

        if (task === "") {
            alert("Enter a task!");
            return;
        }

        tasks.push(task);
        localStorage.setItem("tasks", JSON.stringify(tasks));

        input.value = "";
        displayTasks();
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        localStorage.setItem("tasks", JSON.stringify(tasks));
        displayTasks();
    }

    displayTasks();
</script>

</body>
</html>
